name: Update testimonials from Zoho CRM

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:          # "Run workflow" button
  repository_dispatch:
    types: [crm-approved]

permissions:
  contents: write

concurrency:
  group: testimonials
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch approved testimonials
        env:
          ZOHO_FUNCTION_URL: ${{ secrets.ZOHO_FUNCTION_URL }}
        run: node .github/scripts/update.mjs
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            git config user.name "testimonials-bot"
            git config user.email "actions@users.noreply.github.com"
            git add docs/testimonials.json
            git commit -m "Update testimonials from Zoho CRM"
            git push
          else
            echo "Nothing to commit"
          fi
